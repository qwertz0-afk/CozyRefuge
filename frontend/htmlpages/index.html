<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" type="text/css" href="../css/style.css">
        <link rel="stylesheet" type="text/css" href="../css/primeflex/primeflex.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap">
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="../script/script.js" defer></script>
        <script src="https://kit.fontawesome.com/08bfc793cb.js" crossorigin="anonymous"></script>
        <title>Cozy Refuge</title>
    </head>
    <body>
        <div id="curtain" class="curtain curtain_in"></div>
        <div>
            <p class="title font-bold m-5 select-none text-2xl">Cozy Refuge</p>
        </div>
        <div class="div1">
            <p class="font-bold select-none text-xl enterpassword">Enter a password</p>
                <input id="pass" type="password" placeholder="Enter a password" class="outline-none passinput">
            <p id="warn" class="warning font-bold select-none text-sm opacity-0"></p>
            <div class="btn_container">
                <button class="btn p-3 border-none cursor-pointer font-bold text-base" id="firstbutton">Login</button>
            </div>
        </div>
        <p id="server-warning" class="font-bold select-none text-xl hidden fixed serverwarning" style="color: white; font-family: 'Roboto Slab';">Server is not responding !</p>
    </body>
</html>
