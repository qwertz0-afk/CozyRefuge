<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" type="text/css" href="../css/style.css">
        <link rel="stylesheet" type="text/css" href="../css/primeflex/primeflex.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap">
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="../script/script.js" defer></script>
        <title>Cozy Refuge</title>
    </head>
    <body>
        <img id ="arrow_left" src="../media/left.png" class="arrows">
        <div id="curtain" class="curtain curtain_in"></div>
        <p class="title font-bold m-5 text-2xl select-none">Cozy Refuge</p>
        <div id="homebtn" class="homebtn cursor-pointer" onclick="gotohome()">
            <p class="btntext font-bold select-none cursor">Home</p>
            <img src="../media/home.png"/>
        </div>
        <div id="settingsbtn" class="settingsbtn cursor-pointer" onclick="gotosettings()">
            <p class="btntext font-bold select-none">Settings</p>
            <img src="../media/settings.png" style="scale: 90%;"/>
        </div>
        <div class="flex m-5 flex-grow-1">
            <div id="weatherbloc" class="weatherdiv flex justify-content-center align-items-center flex-column">
            <div id="circle" class="circlediv opacity-0">
                <svg>
                    <circle cx="50" cy="50" r="25" class="circle"/>
                </svg>
            </div>
                <p id="countryNcity" class="countryNcity font-bold select-none"></p>
                <p id="temperature" class="temperature font-bold select-none text-3xl"></p>
                <p id="description" class="description font-bold select-none"></p>
            </div>
            <p id="server-warning" class="font-bold select-none text-xl text-center hidden absolute serverwarning" style="color: white; font-family: 'Roboto Slab';">Server is not responding !</p>
        </div>
    </body>
</html>
